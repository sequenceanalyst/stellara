<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Stellara</title>
<script>
/* This page is shown for any missing address, however deep, so relative links need a fixed base.
   On a GitHub project site (name.github.io/repo/) the base is /repo/. On a custom domain or any other host it is /. */
(function () { var p = location.pathname.split('/'), b = /.github.io$/.test(location.hostname) && p[1] ? '/' + p[1] + '/' : '/'; document.write('<base href="' + b + '">'); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=1793562276">
</head>
<body data-route="404" data-root="./" data-layout="notfound">
<div id="site-header"></div>
<div id="site-hero"></div>
<div class="layout one">
<aside class="side" id="site-side" aria-label="Section navigation"></aside>
<main id="main" class="doc" tabindex="-1">
<p class="lead-p">That page is not on the site. The address may have a typo, or the page may have moved.</p>
<p><a class="chip" href="./">Go to the home page</a> <a class="chip" href="sitemap/">See every page</a></p>
<p>You can also search from the box at the top of the page, or pick a section below.</p>
<div data-auto="home"></div>
<noscript><p class="nojs">The menus on this site need JavaScript. The home page link above still works.</p></noscript>
</main>
</div>
<div id="site-footer"></div>
<script src="assets/site-data.js?v=1793562276"></script>
<script src="assets/site.js?v=1793562276"></script>
<script>
/* the base tag would send same-page anchors (such as the skip link) to the home page, so point them back at this address */
[].forEach.call(document.querySelectorAll('a[href^="#"]'), function (a) { a.setAttribute('href', location.pathname + a.getAttribute('href')); });
</script>
</body>
</html>
